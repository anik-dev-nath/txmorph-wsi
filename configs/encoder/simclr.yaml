backbone: resnet34
proj_dim: 128
temperature: 0.07
# A40 24GB slice: 512 (x2 views = 1024 imgs/step @256px, bf16) fits comfortably.
# CLAUDE.md wants the largest batch the GPU allows -> raise toward OOM if headroom
# remains (watch `nvidia-smi`); use grad-accum if you need more negatives.
batch_size: 512
epochs: 100
lr: 1.0e-3
precision: bf16
num_workers: 4
linear_probe_target: 0.90
